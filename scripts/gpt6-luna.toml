# Every generating stage on gpt-6-luna, flex, reasoning "low"; no writer rotation.
# Derived from scripts/luna-only.toml 2026-09-23 for the post-v2.3 fill round
# (docs/FILL-ROUND-V2.4.md). The judge (`qa`) policy is unchanged: it is a different model
# family on purpose and is not run by the fill chain.

