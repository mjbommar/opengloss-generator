# Account limits for gpt-6-luna on 2026-09-23: 30,000 RPM, 180M TPM (response headers).
# Twelve chain processes share them, so each gets a twelfth with headroom. Flex calls take
# ~5-30 s, so throughput comes from workers, not from the limiter. `max_flex_429s` is
# set high on purpose: this round is flex-only by instruction, so a capacity 429 is retried
# (and, if still short, left for the next idempotent pass) instead of downgrading to `auto`.
[concurrency]
workers = 256
requests_per_minute = 2400
tokens_per_minute = 14000000
max_flex_429s = 1000000
backoff_base_seconds = 2.0
backoff_max_seconds = 120.0
