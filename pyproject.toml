[project]
name = "opengloss-generator"
version = "0.1.0"
description = "Schema-validated, cost-aware LLM generation and enrichment pipeline for the OpenGloss lexical knowledge graph."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Michael Bommarito", email = "mike@273ventures.com" }]
keywords = ["lexicography", "knowledge-graph", "llm", "pydantic-ai", "opengloss"]

dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai>=2.37.0",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
    "structlog>=26.1.0",
    "orjson>=3.11.0",
    "httpx2>=0.29.0",
    "pyarrow>=22.0.0",
]

[project.optional-dependencies]
batch = ["openai>=3.7.0"]
# Only the `export-hf --push` path imports this; the export itself is offline.
hf = ["huggingface-hub>=1.2.0"]

[project.scripts]
opengloss = "opengloss_generator.cli:app"

[project.urls]
Homepage = "https://github.com/mjbommar/opengloss-generator"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
    "ty>=0.0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengloss_generator"]
# The Dale-Chall familiar-word list `vocabulary.py` reads is package data. `data/` is
# gitignored at the repository root (the entry store lives there) and hatchling honours
# VCS ignore files, so without naming it here it is silently missing from the wheel and
# every reading-level check raises at import (D-51).
artifacts = ["src/opengloss_generator/data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # print
    "PT",        # pytest style
    "SIM",       # simplify
    # "TC" is deliberately absent: Pydantic resolves annotations at runtime, so
    # moving model field types into a TYPE_CHECKING block breaks model building.
    "PTH",       # use pathlib
    "PL",        # pylint
    "TRY",       # tryceratops
    "RUF",
    "ASYNC",     # async antipatterns
    "S",         # bandit
    "D",         # pydocstyle
    "ANN",       # annotations
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "TRY003",  # long messages in raises are fine here
    "PLR0913", # generation calls legitimately take many parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "D100", "D104", "ANN201", "ANN001", "PLR2004", "PLR0911"]
# Typer builds its interface from the signature, so options must stay positional.
"src/opengloss_generator/cli.py" = ["PLR0917"]
# These three modules are mostly *published prose*: the field descriptions, blurbs and
# dataset-card templates that end up in a Hugging Face README. Typographic dashes and
# quotes are correct there, so RUF001-003 ("ambiguous unicode character in a string")
# would flag correct output; the SQL in a code sample is a string shown to a reader, not
# a query this package executes, so S608 does not apply either.
"src/opengloss_generator/export/hf_cards.py" = ["RUF001", "RUF002", "RUF003", "S608"]
"src/opengloss_generator/export/hf_schemas.py" = ["RUF001", "RUF002", "RUF003"]
"src/opengloss_generator/export/hf_rows.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not live'"
markers = ["live: hits a real provider and spends money; deselected by default"]
filterwarnings = [
    "error",
]

[tool.ty.environment]
python-version = "3.14"
root = ["./src"]
